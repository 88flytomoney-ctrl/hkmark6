name: Update Mark Six Data

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: hkmark6-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Data Layer ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: Run data fetcher
        run: python scripts/fetch_mark6_data.py

      - name: Verify JSON output
        run: |
          python -c "
          import json
          with open('public/data/draws.json') as f:
              data = json.load(f)
          print(f\"Draws: {len(data['draws'])}\")
          print(f\"Generated: {data['generatedAt']}\")
          print(f\"AI Set A: {data['aiPicks']['setA']}\")
          print(f\"AI Set B: {data['aiPicks']['setB']}\")
          print(f\"Archive entries: {len(data['archive'])}\")
          for d in data['draws'][:3]:
              print(f\"  {d['drawNumber']} {d['drawDate']}: {d['numbers']} + {d['bonus']}\")
          "

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/draws.json public/data/history/
          if ! git diff --staged --quiet; then
            git fetch origin main --depth=1
            git reset --soft origin/main
            git add public/data/draws.json public/data/history/
            git commit -m "🤖 Auto-update Mark Six data $(date +%Y-%m-%d\ %H:%M)"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      # ── Frontend Build & Deploy ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Wait for artifact indexing
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
